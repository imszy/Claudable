name: Deploy to Aliyun FC (cn-beijing)

on:
  workflow_dispatch:
    inputs:
      acr_instance_id:
        description: "ACR InstanceId (must be Standard/Enterprise; Economy tier is not supported by FC custom container)"
        required: false
        default: "cri-noj39a1mn1uyamq9"
      acr_login_server:
        description: "Optional: ACR Login Server (公网, from ACR console). If empty, workflow will auto-try common endpoints."
        required: false
        default: ""
      acr_namespace:
        description: "ACR namespace"
        required: false
        default: "github-demo"

permissions:
  contents: read

env:
  REGION: cn-beijing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set deploy variables
        shell: bash
        run: |
          set -euo pipefail
          echo "ACR_INSTANCE_ID=${{ github.event.inputs.acr_instance_id }}" >> "$GITHUB_ENV"
          echo "ACR_NAMESPACE=${{ github.event.inputs.acr_namespace }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (aliyun cli)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

          curl -fsSL "https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz" -o /tmp/aliyun.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Configure Aliyun CLI (AK)
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}" ] || [ -z "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}" ]; then
            echo "Missing secrets: ALIBABA_CLOUD_ACCESS_KEY_ID / ALIBABA_CLOUD_ACCESS_KEY_SECRET"
            exit 1
          fi
          aliyun configure set \
            --profile "default" \
            --mode AK \
            --region "${REGION}" \
            --access-key-id "${ALIBABA_CLOUD_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIBABA_CLOUD_ACCESS_KEY_SECRET}"

      - name: Login to ACR (temporary token)
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          export DOCKER_CLIENT_TIMEOUT=300
          export DOCKER_HTTP_TIMEOUT=300
          # Aliyun CLI uses env credentials automatically
          export ALIBABA_CLOUD_REGION_ID="${REGION}"
          export ALIBABA_CLOUD_ACCESS_KEY_ID
          export ALIBABA_CLOUD_ACCESS_KEY_SECRET

          if [ -z "${ACR_INSTANCE_ID:-}" ]; then
            echo "Missing env ACR_INSTANCE_ID (required for aliyun cr GetAuthorizationToken in this account)."
            exit 1
          fi
          echo "Using ACR InstanceId: ${ACR_INSTANCE_ID}"

          token_json="$(aliyun cr GetAuthorizationToken --RegionId "${REGION}" --InstanceId "${ACR_INSTANCE_ID}")"
          # Token response differs by CLI versions; try common fields.
          username="$(echo "${token_json}" | jq -r '.data.tempUserName // .data.TempUsername // .tempUserName // .TempUsername // .tempUsername // empty')"
          token="$(echo "${token_json}" | jq -r '.data.authorizationToken // .data.AuthorizationToken // .authorizationToken // .AuthorizationToken // empty')"
          if [ -z "${username}" ] || [ -z "${token}" ]; then
            echo "Failed to parse ACR login token."
            echo "${token_json}"
            exit 1
          fi

          # Determine ACR login server. Different ACR editions/accounts expose different endpoints.
          # If user passes it via workflow input, try it first.
          input_server="${{ github.event.inputs.acr_login_server }}"
          candidates=()
          if [ -n "${input_server}" ]; then
            candidates+=("${input_server}")
          fi
          # Prefer common *public* endpoints (公网). VPC endpoints are not reachable from GitHub-hosted runners.
          candidates+=(
            "registry.${REGION}.aliyuncs.com"
            # VPC endpoint (last resort; usually unreachable from GitHub-hosted runners)
            "registry-vpc.${REGION}.aliyuncs.com"
          )

          # Some accounts return AuthorizationToken in different formats:
          # - raw password (use directly)
          # - base64 of "username:password" (decode and take password part)
          raw_password="${token}"
          decoded_password=""
          if echo "${token}" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            decoded="$(echo "${token}" | base64 -d 2>/dev/null || true)"
            if echo "${decoded}" | grep -q ':'; then
              decoded_password="${decoded#*:}"
            fi
          fi

          login_try() {
            local server="$1"
            local pass="$2"
            local attempt="$3"
            # do not echo password
            echo "${pass}" | docker login "${server}" --username "${username}" --password-stdin >/tmp/docker_login_out 2>&1 && return 0
            echo "docker login failed (attempt ${attempt}) for ${server}:"
            sed -e 's/'"${pass}"'/[REDACTED]/g' /tmp/docker_login_out || true
            return 1
          }

          login_server=""
          for s in "${candidates[@]}"; do
            echo "Trying docker login to: ${s}"
            # Retry a few times to avoid transient network issues.
            for i in 1 2 3; do
              if login_try "${s}" "${raw_password}" "${i}"; then
                login_server="${s}"
                break
              fi
              if [ -n "${decoded_password}" ] && login_try "${s}" "${decoded_password}" "${i}"; then
                login_server="${s}"
                break
              fi
              sleep $((i * 3))
            done
            if [ -n "${login_server}" ]; then break; fi
          done

          if [ -z "${login_server}" ]; then
            echo "ACR docker login failed for all candidate endpoints."
            echo "Please provide the *public* 'Login Server (公网)' from the ACR console via workflow input 'acr_login_server'."
            exit 1
          fi

          echo "ACR_LOGIN_SERVER=${login_server}" >> "$GITHUB_ENV"
          echo "API_IMAGE=${login_server}/${ACR_NAMESPACE}/claudable-api:latest" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${login_server}/${ACR_NAMESPACE}/claudable-web:latest" >> "$GITHUB_ENV"

      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          echo "API_IMAGE=${API_IMAGE}"
          echo "WEB_IMAGE=${WEB_IMAGE}"
          docker build -f apps/api/Dockerfile -t "${API_IMAGE}" .
          docker push "${API_IMAGE}"

          docker build -f apps/web/Dockerfile -t "${WEB_IMAGE}" .
          docker push "${WEB_IMAGE}"

      - name: Deploy API (Aliyun FC custom container)
        id: deploy_api
        shell: bash
        run: |
          set -euo pipefail
          export ALIBABA_CLOUD_REGION_ID="${REGION}"

          upsert_function() {
            local name="$1"
            local image="$2"
            local timeout="$3"
            local body
            body="$(jq -nc \
              --arg functionName "${name}" \
              --arg runtime "custom-container" \
              --arg image "${image}" \
              --argjson port 9000 \
              --argjson timeout "${timeout}" \
              --argjson memorySize 1024 \
              --argjson cpu 0.5 \
              --argjson diskSize 512 \
              --argjson envVars '{"PORT":"9000","API_PORT":"9000"}' \
              '{
                functionName: $functionName,
                runtime: $runtime,
                timeout: $timeout,
                memorySize: $memorySize,
                cpu: $cpu,
                diskSize: $diskSize,
                environmentVariables: $envVars,
                customContainerConfig: { image: $image, port: $port }
              }')"

            if aliyun fc GetFunction --functionName "${name}" >/dev/null 2>&1; then
              if ! out="$(aliyun fc UpdateFunction --functionName "${name}" --body "${body}" 2>&1)"; then
                echo "${out}"
                if echo "${out}" | grep -qi "Economy Edition of Aliyun Container Registry"; then
                  echo ""
                  echo "ACR Economy(经济版) 已不支持 FC 自定义容器所需的镜像处理能力。"
                  echo "请在 ACR 控制台升级实例到 Standard/Enterprise 或切换到非 Economy 的实例，然后重新运行 workflow（填入新的 acr_instance_id / acr_login_server）。"
                fi
                exit 1
              fi
            else
              if ! out="$(aliyun fc CreateFunction --body "${body}" 2>&1)"; then
                echo "${out}"
                if echo "${out}" | grep -qi "Economy Edition of Aliyun Container Registry"; then
                  echo ""
                  echo "ACR Economy(经济版) 已不支持 FC 自定义容器所需的镜像处理能力。"
                  echo "请在 ACR 控制台升级实例到 Standard/Enterprise 或切换到非 Economy 的实例，然后重新运行 workflow（填入新的 acr_instance_id / acr_login_server）。"
                fi
                exit 1
              fi
            fi
          }

          upsert_trigger() {
            local functionName="$1"
            local triggerName="$2"
            local methods_json="$3"
            local body
            body="$(jq -nc \
              --arg triggerName "${triggerName}" \
              --arg triggerType "http" \
              --arg authType "anonymous" \
              --argjson methods "${methods_json}" \
              '{
                triggerName: $triggerName,
                triggerType: $triggerType,
                triggerConfig: { authType: $authType, methods: $methods }
              }')"

            if aliyun fc GetTrigger --functionName "${functionName}" --triggerName "${triggerName}" >/dev/null 2>&1; then
              aliyun fc UpdateTrigger --functionName "${functionName}" --triggerName "${triggerName}" --body "${body}"
            else
              aliyun fc CreateTrigger --functionName "${functionName}" --body "${body}"
            fi
          }

          # API function + anonymous http trigger
          upsert_function "api" "${API_IMAGE}" 600
          upsert_trigger "api" "http" '["GET","POST","PUT","PATCH","DELETE","OPTIONS"]'

          trig="$(aliyun fc GetTrigger --functionName api --triggerName http)"
          api_url="$(echo "${trig}" | jq -r '.urlInternet // .url_internet // .url // empty')"
          if [ -z "${api_url}" ] || [ "${api_url}" = "null" ]; then
            echo "Failed to read API trigger internet URL from GetTrigger response:"
            echo "${trig}"
            exit 1
          fi
          echo "api_url=${api_url}" >> "$GITHUB_OUTPUT"

      - name: Deploy Web (Aliyun FC custom container)
        shell: bash
        env:
          API_BASE: ${{ steps.deploy_api.outputs.api_url }}
        run: |
          set -euo pipefail
          export ALIBABA_CLOUD_REGION_ID="${REGION}"
          ws_base="${API_BASE}"
          ws_base="${ws_base/https:\/\//wss:\/\/}"
          ws_base="${ws_base/http:\/\//ws:\/\/}"

          body="$(jq -nc \
            --arg functionName "web" \
            --arg runtime "custom-container" \
            --arg image "${WEB_IMAGE}" \
            --argjson port 9000 \
            --argjson timeout 60 \
            --argjson memorySize 1024 \
            --argjson cpu 0.5 \
            --argjson diskSize 512 \
            --arg API_BASE "${API_BASE}" \
            --arg WS_BASE "${ws_base}" \
            '{
              functionName: $functionName,
              runtime: $runtime,
              timeout: $timeout,
              memorySize: $memorySize,
              cpu: $cpu,
              diskSize: $diskSize,
              environmentVariables: {
                PORT: "9000",
                NODE_ENV: "production",
                API_BASE: $API_BASE,
                NEXT_PUBLIC_API_BASE: $API_BASE,
                NEXT_PUBLIC_WS_BASE: $WS_BASE
              },
              customContainerConfig: { image: $image, port: $port }
            }')"

          if aliyun fc GetFunction --functionName "web" >/dev/null 2>&1; then
            aliyun fc UpdateFunction --functionName "web" --body "${body}"
          else
            aliyun fc CreateFunction --body "${body}"
          fi

          # anonymous http trigger for web
          trig_body="$(jq -nc \
            --arg triggerName "http" \
            --arg triggerType "http" \
            --arg authType "anonymous" \
            --argjson methods '["GET","OPTIONS"]' \
            '{
              triggerName: $triggerName,
              triggerType: $triggerType,
              triggerConfig: { authType: $authType, methods: $methods }
            }')"

          if aliyun fc GetTrigger --functionName "web" --triggerName "http" >/dev/null 2>&1; then
            aliyun fc UpdateTrigger --functionName "web" --triggerName "http" --body "${trig_body}"
          else
            aliyun fc CreateTrigger --functionName "web" --body "${trig_body}"
          fi

          web_trig="$(aliyun fc GetTrigger --functionName web --triggerName http)"
          web_url="$(echo "${web_trig}" | jq -r '.urlInternet // .url_internet // .url // empty')"
          if [ -n "${web_url}" ] && [ "${web_url}" != "null" ]; then
            echo ""
            echo "Web URL: ${web_url}"
          else
            echo "Failed to parse Web URL:"
            echo "${web_trig}"
          fi

